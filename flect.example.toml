# auth-service in a product's flect.toml (services format, RFC-0019).
#
# auth is deployed as one service of a product, on the product's own domain, so
# the session cookie and the pages share the origin the product is on. This is
# the block to copy into that product's file; it is not a file to deploy by
# itself, which is why it is not named flect.toml.

# Two surfaces, one service. Pages are at the service root and the API is under
# /api; the gateway publishes each under its own prefix and replaces it:
#
#   /auth/login        ->  /login          what a person sees
#   /v1/auth/session   ->  /api/session    what a program calls
#
# The version in the second address belongs to the gateway. A /v2/auth can be
# pointed at another deployment, or at this same /api, without a release here.
#
# Needs a broker that accepts an expose list with `to` (flect, clave #161). On
# an older broker `expose = "/v1/auth"` strips to the root, where 2.0 no longer
# serves the API: stay on auth-service 1.x until the broker is updated.
[services.auth]
image   = "ghcr.io/dotlabshq/auth-service:2.0.0"
port    = 3000
expose  = [
  { path = "/auth" },
  { path = "/v1/auth", to = "/api" },
]
calls   = ["iam"]               # IAM_SERVICE_URL: /sync at sign-in, sub = the iam user id
secrets = ["AUTH_SIGNING_KEY", "AUTH_SESSION_SECRET", "AUTH_SERVICE_CLIENTS"]

[services.auth.vars]
NODE_ENV       = "production"
APP_PUBLIC_URL = "https://example.com"      # the origin the browser is on
OIDC_ISSUER    = "https://idp.example.com"
OIDC_CLIENT_ID = "<pkce client id>"
OIDC_SCOPE     = "openid profile email"
# The sign-in page's buttons: name:<the provider's IdP id>.
# OIDC_IDPS    = "google:<idp id>,github:<idp id>"
# OIDC_ORG_ID  = "<org id>"
# The OIDC app must list https://example.com/auth/oidc/callback as a redirect
# URI. Until it does, pin the address it has:
# OIDC_REDIRECT_URI = "https://example.com/v1/auth/oidc/callback"
#
# What the pages look like:
AUTH_UI_NAME        = "Example"
AUTH_UI_TERMS_URL   = "/terms"
AUTH_UI_PRIVACY_URL = "/privacy"
# AUTH_UI_PATH and AUTH_API_PATH default to the two paths exposed above; set
# them only if the expose list publishes somewhere else.

# A service that calls auth inside the cluster (`calls = ["auth"]`) reaches the
# service itself, with no gateway in between, so it names the API mount:
#   <AUTH_SERVICE_URL>/api/session      not  <AUTH_SERVICE_URL>/session
