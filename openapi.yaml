openapi: 3.1.0
info:
  title: auth-service
  version: "1.0"
  description: |
    The realm's sign-in gate and its only token issuer.

    **Mounting.** This document is the API: what a program calls. The service
    mounts it under `/api`, and a gateway publishes that at `/v1/auth`,
    replacing the prefix — so `/start` here is `/api/start` inside the service
    and `https://<host>/v1/auth/start` in public. The version in the public
    address is the gateway's to choose; the service does not know it.

    **Pages are not in this document.** What a person sees lives under `/ui`,
    which a gateway publishes at `/auth`: `/auth/login` (the sign-in
    page), `/auth/login/{idp}` and `/auth/login/sso` (off to the provider),
    `/auth/oidc/callback`, `/auth/logout`, `/auth/cli` (approve a terminal).
    They answer HTML and redirects, never JSON, and they are addresses to send
    a browser to, not a contract to call. The routes below tagged `browser`
    and marked deprecated are those same navigations at the addresses they had
    before 2.0; they keep working through 2.x and are removed in 3.0.

    `/healthz` is on neither surface: it is at the service root, which no
    gateway rule reaches, for the platform and the internal network.

    **Field names are `snake_case`** (ADR-043), which the OAuth2 fields here —
    `token_type`, `expires_in`, `client_id` — already were.

    **What a token is.** An identity token and nothing more: `iss`, `aud`, `sub`,
    `iat`, `exp`, `jti`, `type`. Organisation and role are deliberately absent,
    because membership changes while a token lives and a token carrying a role
    goes stale and lies. A service that needs org context asks the org service.

    **Why only this service signs.** With ES256 the private key never leaves
    auth-service; everyone else verifies with the public key from
    `/.well-known/jwks.json` and cannot mint anything. The shared HMAC secret
    this replaces gave every holder the power to issue tokens, including tokens
    claiming to be another user. There is deliberately no endpoint that mints a
    token for an arbitrary subject.

servers:
  - url: https://auth.example.com/v1/auth
    description: Behind a gateway
  - url: http://127.0.0.1:3003/api
    description: Direct, for local development

tags:
  - name: discovery
    description: Unauthenticated; readers include the gateway and signed-out clients
  - name: session
    description: The browser session, as a program asks about it
  - name: browser
    description: Deprecated — sign-in navigations at their pre-2.0 addresses; the pages are at `/auth`
  - name: cli
    description: Browser-approved sign-in for a command line
  - name: tokens
    description: Tokens that are not a browser login

paths:
  /.well-known/service:
    get:
      tags: [discovery]
      summary: What this service is and what contract it speaks
      description: |
        `capabilities` lists `jwks` only when the realm has a signing key. Without
        one the realm still issues HS256 and there is nothing to verify against,
        so a consumer can tell the two states apart rather than fetching an empty
        key set and guessing.
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceManifest" }

  /.well-known/jwks.json:
    get:
      tags: [discovery]
      summary: The realm's public signing keys
      description: |
        Every verifier in the realm reads this. Contains public material only.

        During a rotation both the new and the retired key are listed, for longer
        than a token lives, so tokens signed by either keep verifying.

        A realm with no signing key answers an empty set rather than 404: a 404
        risks being cached as if it were a key set.
      security: []
      responses:
        "200":
          description: A JWKS, possibly empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/Jwk" }

  /login:
    get:
      tags: [browser]
      deprecated: true
      summary: Begin OIDC sign-in (send people to the page at `/auth/login` instead)
      description: |
        Before 2.0 this address started a sign-in, and products link to it. It
        still does exactly that: a redirect to the identity provider's own
        sign-in. In dev mode, where there is no provider, it redirects to the
        sign-in page. New links should go to the page, `/auth/login`, which
        offers the configured IdPs and says what went wrong when something did.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReturnTo"
      responses:
        "302": { description: Redirect to the identity provider, or to the sign-in page in dev mode }

  /login/{idp}:
    get:
      tags: [browser]
      deprecated: true
      summary: Begin sign-in straight with a named IdP (now at `/auth/login/{idp}`)
      description: |
        Same PKCE, `returnTo` and callback as `GET /login`, but the authorize
        request carries the provider's IdP hint scope for the IdP configured
        under this name (`OIDC_IDPS`), so the provider's own login screens are
        skipped. No `prompt` is sent. In dev mode this answers the dev form.
      security: []
      parameters:
        - name: idp
          in: path
          required: true
          schema: { type: string, example: google }
          description: A name listed by `GET /idps`
        - $ref: "#/components/parameters/ReturnTo"
      responses:
        "200":
          description: Dev mode only — the password form, which posts to `POST /login`
          content:
            text/html:
              schema: { type: string }
        "302": { description: Redirect to the identity provider, with the IdP hint }
        "404":
          description: No IdP is configured under this name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: unknown_idp }
                  message: { type: string }
  /idps:
    get:
      tags: [session]
      summary: The IdPs a login page can offer
      description: Names only; the provider's ids are configuration and are not published.
      security: []
      responses:
        "200":
          description: Configured IdP names, in configuration order
          content:
            application/json:
              schema:
                type: object
                required: [idps]
                properties:
                  idps:
                    type: array
                    items: { type: string }
                    example: [google, github]
  /oidc/callback:
    get:
      tags: [browser]
      deprecated: true
      summary: Identity provider redirect target (now at `/auth/oidc/callback`)
      description: |
        Served here for a realm whose OIDC app still lists the pre-2.0 redirect
        URI; pin it with `OIDC_REDIRECT_URI` until the new one is registered.
        A failure redirects to the sign-in page with `?error=`.

        Exchanges the code, resolves the platform identity (registering it with
        iam-service when one is configured), and sets the session cookies plus
        the realm identity token.
      security: []
      responses:
        "302": { description: Redirect back into the app }

  /session:
    get:
      tags: [session]
      summary: The current browser session, if any
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_authenticated: { type: boolean }
                  subject: { type: string }
                  email: { type: string }
                  name: { type: string }
                  issuer: { type: string }
                  expires_at: { type: integer }
                  user_id: { type: string }

  /logout:
    get:
      tags: [browser]
      deprecated: true
      summary: Clear this app's cookies, then go somewhere (now at `/auth/logout`)
      description: |
        For a link or a navigation. Local by default; `sso=1` also ends the
        identity provider's session. Note that an already-issued token stays
        valid until it expires — the realm has no revocation list today, which
        is what `jti` in every token is there to make possible later.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReturnTo"
        - name: sso
          in: query
          schema: { type: string, enum: ["1"] }
          description: Also sign out at the identity provider
      responses:
        "302": { description: Redirect }
    post:
      tags: [session]
      summary: Clear this app's cookies, for a page that signs out with fetch()
      description: |
        The same local logout as `GET`, answered without a redirect: a page that
        draws its own next screen has no use for one.
      security: []
      responses:
        "204": { description: Cookies cleared }

  /token:
    get:
      tags: [session]
      summary: Hand the session's identity token to the caller
      description: |
        A signed-in browser receives the identity token as JSON.

        Deprecated: with `state` present this used to render the CLI approval
        page. It now redirects to that page, `/auth/cli?state=…`.
      security: []
      parameters:
        - name: state
          in: query
          deprecated: true
          schema: { type: string }
          description: A link an older CLI printed; redirects to the approval page
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "302": { description: "`state` was given: redirect to the approval page" }
        "401": { description: No session }
        "500": { description: The realm has no way to sign }

  /start:
    get:
      tags: [cli]
      summary: Begin a browser-approved CLI sign-in
      description: |
        Returns a `state` handle and the URL the user must approve. Poll
        `/poll/{state}` until it reports `done`.

        The handle lives `expires_in` seconds. A client should poll until exactly
        that moment and no longer: giving up sooner reports failure while the
        link still works.
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [state, url, expires_in]
                properties:
                  state: { type: string }
                  url: { type: string, description: The page the user approves }
                  expires_in: { type: integer, description: Seconds }

  /poll/{state}:
    get:
      tags: [cli]
      summary: Wait for the user to approve
      description: |
        `pending` until approval, then `done` with the token exactly once — the
        handle is consumed. An unknown handle and an expired one both answer
        `expired`; from the client's side they mean the same thing.
      security: []
      parameters:
        - name: state
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, done, expired] }
                  token: { type: string, description: Present only with `done` }

  /approve:
    post:
      tags: [cli]
      summary: Approve a waiting CLI sign-in
      description: |
        Submitted from a signed-in browser by a console that draws its own
        approval screen, as JSON. (This service's own page, `/auth/cli`, posts
        its form to the page surface; a form sent here is still taken.) The
        token is not in the answer: it belongs to the waiting CLI, which
        collects it from `/poll`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/ApproveRequest" }
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRequest" }
      responses:
        "200":
          description: Approved (JSON callers)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        "302": { description: Approved; redirect to the done page (form callers) }
        "401": { description: Not signed in }
        "404": { description: Unknown or expired handle }
        "409": { description: Already used }

  /service-token:
    post:
      tags: [tokens]
      summary: A token for the calling service itself
      description: |
        Client credentials. The subject is the authenticated client and cannot be
        chosen, so a leaked service secret speaks for that service alone — the
        difference from the shared signing secret, which spoke for everyone.

        An unknown client and a wrong secret get the same answer; telling them
        apart would turn this into a list of which services exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: { type: string }
                client_secret: { type: string }
                expires_in:
                  type: integer
                  description: Seconds; capped at 3600
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { description: invalid_client }
        "503": { description: No service clients configured }

  /exchange:
    post:
      tags: [tokens]
      summary: Narrow your own token
      description: |
        Returns a short-lived `assistant` token for the **same** subject, limited
        to one organisation and an optional scope. Intended for assistants, CI
        jobs and anything else that should not carry a full sign-in.

        Only a `human` token may be exchanged. Allowing a service or an already
        narrowed token to exchange would build chains that outlive and outreach
        the sign-in they came from.

        `org_id` is a restriction, not a grant: it says "only this org", and the
        consuming service still checks membership, because auth knows nothing
        about organisations.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id: { type: string }
                scope: { type: string }
                expires_in:
                  type: integer
                  description: Seconds; capped at 3600
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { description: Missing or invalid token }
        "403": { description: The presented token is not a human token }

components:
  parameters:
    ReturnTo:
      name: returnTo
      in: query
      schema: { type: string }
      description: |
        Where to send the browser afterwards: a path on the current origin, or
        an absolute URL on an origin the realm publishes (`APP_PUBLIC_URL` and
        `AUTH_RETURN_ORIGINS`). Anything else becomes `/`. `redirectTo` is
        accepted as an older name for the same thing.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApproveRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, description: The handle `/start` returned }
    TokenResponse:
      type: object
      required: [token, token_type, expires_in]
      properties:
        token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, description: Seconds }

    ServiceManifest:
      type: object
      required: [name, version, api_version]
      properties:
        name: { type: string, example: auth }
        version: { type: string, description: Release of this deployment }
        api_version:
          type: string
          description: Contract version; moves only when the HTTP surface breaks callers
        openapi_url: { type: string }
        capabilities:
          type: array
          items: { type: string }

    Jwk:
      type: object
      description: Public key only; the private half is never published.
      properties:
        kty: { type: string, example: EC }
        crv: { type: string, example: P-256 }
        alg: { type: string, example: ES256 }
        use: { type: string, example: sig }
        kid: { type: string, description: "RFC 7638 thumbprint, derived from the key" }
        x: { type: string }
        y: { type: string }

security:
  - bearerAuth: []
